name: Deploy to GitHub Pages

# Se dispara con cada push a main (reemplaza la sincronización automática
# que hacía Bolt.new) y también se puede lanzar a mano desde la pestaña
# Actions del repo.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Evita que dos deploys se pisen si llegan pushes seguidos — el run nuevo
# cancela al que estaba en curso en vez de dejarlos correr en paralelo.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          # Variables públicas del cliente Supabase (la anon key está
          # pensada para ser pública — la protección real es RLS en la
          # base, no que esta clave sea secreta). Se configuran en
          # Settings → Secrets and variables → Actions → Variables.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
